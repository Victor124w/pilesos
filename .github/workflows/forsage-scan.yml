name: forsage prices

# Снимок цен gsm-forsage.com.ua (розничная + партнёрская) и наличия «є/немає».
# Раз в 2 часа, 08:30–20:30 Киев — общим слотом с остальными сайтами (с 2026-09-25; до того ежечасно круглосуточно).
# Расписание НЕ здесь, как и у остальных парсеров: планировщик GitHub тихо роняет запуски.
# Триггерит Cloudflare-воркер общим двухчасовым слотом (`30 5-17/2 * * *`) через workflow_dispatch.
#
# ⚠️ Проход идёт ПОД ЛОГИНОМ дилерского кабинета — иначе партнёрских цен не будет.
# Учётка лежит в Actions Secrets (FORSAGE_EMAIL / FORSAGE_PASSWORD), в коде её нет.
# Токен берётся на проход через REST (с 25.09 — POST /graphql сайт закрыл), истекает сам ~за час.
on:
  workflow_dispatch:
    inputs:
      manual:
        description: 'Ручной запуск'
        required: false
        default: 'false'

concurrency:
  group: forsage-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Scan prices → D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FORSAGE_EMAIL: ${{ secrets.FORSAGE_EMAIL }}
          FORSAGE_PASSWORD: ${{ secrets.FORSAGE_PASSWORD }}
        run: node forsage-run.mjs
