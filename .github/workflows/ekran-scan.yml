name: ekran scan

# Парсинг каталога ekran.com.ua → диффы (продажи/приходы) в D1 + пред-сборка остатков.
# Расписание НЕ здесь, как и у m112: планировщик GitHub тихо роняет плановые запуски.
# Триггерит Cloudflare-воркер своим cron через workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      manual:
        description: 'Ручной запуск (прислать уведомление о завершении)'
        required: false
        default: 'false'

concurrency:
  group: ekran-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Scan catalog → D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node ekran-run.mjs
      - name: Build stock xlsx → Telegram file_id → D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: node ekran-build-stock.mjs
      - name: Snapshots (утро/вечер)
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_DATABASE_ID: ${{ secrets.CF_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node ekran-snapshots.mjs
